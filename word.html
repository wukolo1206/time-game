<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>時間應用題</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', sans-serif; background: #f0f4ff; min-height: 100vh;
           -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    .nav { display: flex; justify-content: space-between; align-items: center;
           padding: 10px 16px; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .nav a  { font-size: 14px; color: #666; text-decoration: none; }
    .nav h2 { font-size: 16px; color: #333; font-weight: bold; }
    .nav span { width: 60px; }

    .act-bar { display: flex; background: #fff; border-bottom: 2px solid #e8eeff;
               overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .act-bar::-webkit-scrollbar { display: none; }
    .act-btn { flex: 1; min-width: 60px; padding: 8px 4px 7px; border: none;
               background: transparent; font-size: 11px; font-weight: bold; color: #999;
               cursor: pointer; text-decoration: none;
               display: flex; flex-direction: column; align-items: center; gap: 2px;
               border-bottom: 3px solid transparent; transition: color .15s, border-color .15s;
               white-space: nowrap; }
    .act-btn .act-icon { font-size: 15px; }
    .act-btn.act-on { color: #20c997; border-bottom-color: #20c997; background: #e6fcf5; }

    .wrap { max-width: 600px; margin: 0 auto; padding: 14px 12px;
            display: flex; flex-direction: column; gap: 12px; }

    /* Group bar */
    .group-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .gp { border: 2px solid #dde3ff; background: #fff; border-radius: 20px;
          padding: 6px 14px; font-size: 14px; font-weight: bold; color: #888;
          cursor: pointer; transition: all .15s; }
    .gp.on { background: #20c997; border-color: #20c997; color: #fff; }

    .prog-row  { display: flex; align-items: center; gap: 10px; }
    .prog-label { font-size: 13px; color: #888; white-space: nowrap; }
    .prog-track { flex: 1; height: 6px; background: #dde3ff; border-radius: 3px; }
    .prog-fill  { height: 100%; background: #20c997; border-radius: 3px; transition: width .4s; }

    /* Main card */
    .main-card { background: #fff; border-radius: 20px;
                 box-shadow: 0 2px 16px rgba(32,201,151,.12); padding: 20px 18px;
                 display: flex; flex-direction: column; gap: 18px; }

    .prob-text { font-size: 16px; line-height: 1.9; color: #333;
                 padding-bottom: 14px; border-bottom: 1px dashed #e0e0e0; }

    /* Steps (2 only) */
    .steps { display: flex; gap: 8px; justify-content: center; align-items: center; }
    .step { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #dde;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: #bbb; transition: all .3s; }
    .step.done   { background: #20c997; border-color: #20c997; color: #fff; }
    .step.active { background: #e6fcf5; border-color: #20c997; color: #20c997; }
    .step-sep { color: #ddd; font-size: 18px; }

    /* ── Phase 1: Timeline ── */
    .tl-prompt { font-size: 14px; font-weight: bold; color: #555; text-align: center; }

    .timeline { display: flex; align-items: stretch; justify-content: center;
                gap: 4px; margin: 4px 0; }
    .tl-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .tl-lbl { font-size: 11px; font-weight: bold; padding: 3px 6px; border-radius: 8px;
              text-align: center; width: 100%; }
    .tl-lbl.start   { background: #fff3bf; color: #e67700; }
    .tl-lbl.elapsed { background: #dbe4ff; color: #4263eb; }
    .tl-lbl.end     { background: #d3f9d8; color: #2f9e44; }

    .tl-arrow { font-size: 18px; color: #ccc; align-self: center;
                padding-top: 26px; flex-shrink: 0; }

    .tl-slot { width: 100%; min-height: 56px; border: 2px dashed #ddd; border-radius: 12px;
               display: flex; align-items: center; justify-content: center;
               font-size: 13px; font-weight: bold; color: #bbb;
               background: #fafafa; padding: 6px; text-align: center; line-height: 1.3;
               cursor: pointer; transition: border-color .2s, background .2s; }
    .tl-slot.active   { border-color: #20c997; animation: pulse 1.2s ease-in-out infinite; }
    .tl-slot.unknown  { font-size: 28px; color: #ddd; cursor: default;
                        background: #f5f5f5; border-style: solid; border-color: #e0e0e0; }
    .tl-slot.locked-start   { border-style: solid; border-color: #e67700; background: #fffbf0;
                               color: #e67700; cursor: default;
                               animation: popIn .35s cubic-bezier(.17,.67,.44,1.4); }
    .tl-slot.locked-elapsed { border-style: solid; border-color: #4263eb; background: #f0f4ff;
                               color: #4263eb; cursor: default;
                               animation: popIn .35s cubic-bezier(.17,.67,.44,1.4); }
    .tl-slot.locked-end     { border-style: solid; border-color: #2f9e44; background: #f3fdf5;
                               color: #2f9e44; cursor: default;
                               animation: popIn .35s cubic-bezier(.17,.67,.44,1.4); }
    .tl-slot.err { animation: shake .3s ease !important; border-color: #ff6b6b !important; }

    .card-pool { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .val-card { border: 2px solid #a5d8ff; border-radius: 12px; padding: 10px 14px;
                font-size: 14px; font-weight: bold; color: #555; cursor: pointer;
                background: #f0f8ff; transition: all .2s; user-select: none; }
    .val-card.selected { border-color: #20c997; background: #e6fcf5; color: #20c997;
                         box-shadow: 0 0 0 3px rgba(32,201,151,.2); }
    .val-card.gone { visibility: hidden; pointer-events: none; }

    /* ── Phase 2: Equation ── */
    .eq-prompt { font-size: 14px; font-weight: bold; color: #555; text-align: center; }
    .eq-options { display: flex; flex-direction: column; gap: 8px; }
    .eq-opt { border: 2px solid #dde3ff; border-radius: 14px; background: #f8faff;
              padding: 13px 14px; font-size: 14px; font-weight: bold; color: #444;
              cursor: pointer; transition: all .2s; text-align: center; }
    .eq-opt:active { transform: scale(.98); }
    .eq-opt.ok  { border-color: #20c997; background: #e6fcf5; color: #20c997;
                  animation: popIn .3s cubic-bezier(.17,.67,.44,1.4); }
    .eq-opt.err { animation: shake .3s ease; border-color: #ff6b6b; background: #fff5f5; }

    /* Equation reveal after correct selection */
    .eq-reveal { border-radius: 16px; background: #f0fdf4; border: 2px solid #51cf66;
                 padding: 16px; text-align: center; display: none; }
    .eq-reveal.show { display: block; animation: fadeUp .4s ease; }
    .eq-abstract { font-size: 13px; font-weight: bold; color: #888; margin-bottom: 8px; }
    .eq-concrete { font-size: 20px; font-weight: bold; color: #2f9e44; line-height: 1.6; }
    .eq-concrete .qs { color: #e67700; }

    .next-btn { border: none; border-radius: 14px; background: #20c997; color: #fff;
                font-size: 18px; font-weight: bold; padding: 13px; cursor: pointer;
                display: none; width: 100%; }
    .next-btn.show { display: block; animation: fadeUp .4s ease; }

    /* Done */
    .done-banner { background: #fff; border-radius: 24px; padding: 36px 24px;
                   box-shadow: 0 4px 24px rgba(32,201,151,.18); text-align: center; display: none; }
    .done-banner.show { display: block; animation: fadeUp .5s ease; }
    .done-star  { font-size: 52px; margin-bottom: 10px;
                  animation: popIn .5s cubic-bezier(.17,.67,.44,1.4); }
    .done-title { font-size: 26px; font-weight: bold; color: #2f9e44; margin-bottom: 6px; }
    .done-group { display: inline-block; background: #e6fcf5; color: #20c997;
                  font-size: 14px; font-weight: bold; border-radius: 20px;
                  padding: 4px 14px; margin-bottom: 16px; }
    .done-btns  { display: flex; gap: 10px; justify-content: center; }
    .done-btn { border: none; border-radius: 14px; font-size: 16px; font-weight: bold;
                padding: 12px 22px; cursor: pointer; }
    .done-btn.retry { background: #f1f3ff; color: #4263eb; }
    .done-btn.next  { background: #20c997; color: #fff; }
    .done-btn.next.hide { display: none; }

    .phase-sec { display: flex; flex-direction: column; gap: 14px; }

    @keyframes shake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
    @keyframes pulse  { 0%,100%{box-shadow:0 0 0 0 rgba(32,201,151,.4)} 50%{box-shadow:0 0 0 8px rgba(32,201,151,0)} }
    @keyframes popIn  { 0%{transform:scale(.7);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>

<div class="nav">
  <a href="index.html">← 返回</a>
  <h2>時間應用題</h2>
  <span></span>
</div>
<nav class="act-bar">
  <a class="act-btn" href="day24.html"><span class="act-icon">🕐</span>24小時</a>
  <a class="act-btn" href="units.html"><span class="act-icon">⏱️</span>時分秒</a>
  <a class="act-btn" href="calc.html"><span class="act-icon">🧮</span>加減計算</a>
  <a class="act-btn act-on" href="word.html"><span class="act-icon">📝</span>應用題</a>
</nav>

<div class="wrap">
  <div class="group-bar" id="groupBar"></div>

  <div class="prog-row">
    <span class="prog-label" id="progLabel">0 / 5</span>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <div class="main-card" id="mainCard">
    <!-- Step indicator -->
    <div class="steps">
      <div class="step active" id="s1">1</div>
      <div class="step-sep">›</div>
      <div class="step" id="s2">2</div>
    </div>

    <div class="prob-text" id="probText"></div>

    <!-- Phase 1: Timeline placement -->
    <div class="phase-sec" id="phase1">
      <div class="tl-prompt">把數值放到正確的格子裡</div>
      <div class="timeline">
        <div class="tl-col">
          <div class="tl-lbl start">開始時刻</div>
          <div class="tl-slot" id="slotStart" onclick="placeCard('start')">點我放入</div>
        </div>
        <div class="tl-arrow">→</div>
        <div class="tl-col">
          <div class="tl-lbl elapsed">經過時間</div>
          <div class="tl-slot" id="slotElapsed" onclick="placeCard('elapsed')">點我放入</div>
        </div>
        <div class="tl-arrow">→</div>
        <div class="tl-col">
          <div class="tl-lbl end">結束時刻</div>
          <div class="tl-slot" id="slotEnd" onclick="placeCard('end')">點我放入</div>
        </div>
      </div>
      <div class="card-pool" id="cardPool"></div>
    </div>

    <!-- Phase 2: Equation selection + reveal -->
    <div class="phase-sec" id="phase2" style="display:none">
      <div class="eq-prompt">選出正確的算式結構</div>
      <div class="eq-options" id="eqOptions"></div>
      <div class="eq-reveal" id="eqReveal">
        <div class="eq-abstract" id="eqAbstract"></div>
        <div class="eq-concrete" id="eqConcrete"></div>
      </div>
      <button class="next-btn" id="nextBtn" onclick="nextProblem()">下一題 →</button>
    </div>
  </div>

  <!-- Done banner -->
  <div class="done-banner" id="doneBanner">
    <div class="done-star">⭐</div>
    <div class="done-title">全部完成！</div>
    <div class="done-group" id="doneGroup"></div>
    <div class="done-btns">
      <button class="done-btn retry" onclick="initGroup()">再挑戰一次</button>
      <button class="done-btn next" id="doneNext" onclick="goNextGroup()">換下一組 →</button>
    </div>
  </div>
</div>

<script>
// ask: 'start'|'elapsed'|'end'
// cards: [{val, slot}] — known values only (2 cards)
// startVal / elapsedVal / endVal: display strings for the equation reveal

const PROBLEMS = [
  // ── Group 1 ── 2 elapsed + 2 end + 1 start ──────────────
  { text:'洗衣機從下午6：07開始運轉洗衣服，到下午6：42洗好，共花了幾分鐘？',
    ask:'elapsed',
    cards:[{val:'下午6時7分',slot:'start'},{val:'下午6時42分',slot:'end'}] },
  { text:'佳煜練習跑步，從上午6時18分跑到上午6時52分，他一共跑了幾分鐘？',
    ask:'elapsed',
    cards:[{val:'上午6時18分',slot:'start'},{val:'上午6時52分',slot:'end'}] },
  { text:'現在是上午6時20分，再過35分鐘，是上午幾時幾分？',
    ask:'end',
    cards:[{val:'上午6時20分',slot:'start'},{val:'35分鐘',slot:'elapsed'}] },
  { text:'娟娟從下午2時19分開始拖地，一共拖了28分鐘，拖完地時是下午幾時幾分？',
    ask:'end',
    cards:[{val:'下午2時19分',slot:'start'},{val:'28分鐘',slot:'elapsed'}] },
  { text:'小紜寫功課花了48分鐘，寫完功課是下午5時53分，小紜是下午幾時幾分開始寫功課的？',
    ask:'start',
    cards:[{val:'48分鐘',slot:'elapsed'},{val:'下午5時53分',slot:'end'}] },

  // ── Group 2 ── 2 elapsed + 2 end + 1 start ──────────────
  { text:'順英從下午1時14分開始燙衣服，一直到下午1時52分才燙完所有的衣服，她燙衣服一共花了幾分鐘？',
    ask:'elapsed',
    cards:[{val:'下午1時14分',slot:'start'},{val:'下午1時52分',slot:'end'}] },
  { text:'現在是下午5時26分，還差幾分鐘就是下午5時55分？',
    ask:'elapsed',
    cards:[{val:'下午5時26分',slot:'start'},{val:'下午5時55分',slot:'end'}] },
  { text:'爸爸在上午8時13分開車去出差，43分鐘後到達目的地，到達的時間是上午幾時幾分？',
    ask:'end',
    cards:[{val:'上午8時13分',slot:'start'},{val:'43分鐘',slot:'elapsed'}] },
  { text:'哥哥從家裡到學校要35分鐘，他上午9時15分從家裡出發，到學校是上午幾時幾分？',
    ask:'end',
    cards:[{val:'上午9時15分',slot:'start'},{val:'35分鐘',slot:'elapsed'}] },
  { text:'爸爸從家裡到公司上班需要26分鐘，公司上班的時間為上午8時30分，他最晚要在上午幾時幾分從家裡出發？',
    ask:'start',
    cards:[{val:'26分鐘',slot:'elapsed'},{val:'上午8時30分',slot:'end'}] },

  // ── Group 3 ── 2 elapsed + 1 end + 2 start ──────────────
  { text:'媽媽上午8時17分出門買菜，上午8時56分買完菜回到家，媽媽買菜花了幾分鐘？',
    ask:'elapsed',
    cards:[{val:'上午8時17分',slot:'start'},{val:'上午8時56分',slot:'end'}] },
  { text:'正翔從下午2時8分開始寫功課，到下午3時15分才寫完，他寫功課一共花了幾小時幾分鐘？',
    ask:'elapsed',
    cards:[{val:'下午2時8分',slot:'start'},{val:'下午3時15分',slot:'end'}] },
  { text:'媽媽從15時28分開始煮紅豆湯，煮湯要花25分鐘，煮好時是幾時幾分？',
    ask:'end',
    cards:[{val:'15時28分',slot:'start'},{val:'25分鐘',slot:'elapsed'}] },
  { text:'姐姐寫數學考卷花了48分鐘，寫完的時間是下午4時50分，她是下午幾時幾分開始寫數學考卷的？',
    ask:'start',
    cards:[{val:'48分鐘',slot:'elapsed'},{val:'下午4時50分',slot:'end'}] },
  { text:'小琪從家裡到圖書館要走18分鐘，她下午3時40分到達圖書館，她是在下午幾時幾分從家裡出發的？',
    ask:'start',
    cards:[{val:'18分鐘',slot:'elapsed'},{val:'下午3時40分',slot:'end'}] },

  // ── Group 4 ── 2 elapsed + 2 end + 1 start ──────────────
  { text:'書帆和同學一起去科博館看展覽，下午1時40分進場，15時50分出場，一共經過多少時間？',
    ask:'elapsed',
    cards:[{val:'下午1時40分',slot:'start'},{val:'15時50分',slot:'end'}] },
  { text:'姐姐搭高鐵，上午6時26分從臺北站出發，上午8時40分到達左營站，行車時間是幾小時幾分鐘？',
    ask:'elapsed',
    cards:[{val:'上午6時26分',slot:'start'},{val:'上午8時40分',slot:'end'}] },
  { text:'哥哥從下午4時32分開始跑步，跑了1小時25分鐘，跑完的時間是下午幾時幾分？',
    ask:'end',
    cards:[{val:'下午4時32分',slot:'start'},{val:'1小時25分鐘',slot:'elapsed'}] },
  { text:'慶生會從上午10時10分開始，進行了1小時45分鐘，慶生會在上午幾時幾分結束？',
    ask:'end',
    cards:[{val:'上午10時10分',slot:'start'},{val:'1小時45分鐘',slot:'elapsed'}] },
  { text:'寧紜看卡通花了35分鐘，看完是14時38分，寧紜是幾時幾分開始看卡通的？',
    ask:'start',
    cards:[{val:'35分鐘',slot:'elapsed'},{val:'14時38分',slot:'end'}] },

  // ── Group 5 ── 2 elapsed + 2 end + 1 start ──────────────
  { text:'爸爸下午2時32分出門，下午4時38分回來，爸爸出去幾小時幾分鐘？',
    ask:'elapsed',
    cards:[{val:'下午2時32分',slot:'start'},{val:'下午4時38分',slot:'end'}] },
  { text:'家語和同學參觀書展，下午1時30分進入，下午5時52分離開，她們參觀書展待了幾小時幾分鐘？',
    ask:'elapsed',
    cards:[{val:'下午1時30分',slot:'start'},{val:'下午5時52分',slot:'end'}] },
  { text:'意芳從13時2分開始寫功課，寫了3小時，寫完是下午幾時幾分？',
    ask:'end',
    cards:[{val:'13時2分',slot:'start'},{val:'3小時',slot:'elapsed'}] },
  { text:'爸爸4：20PM開車從臺中出發，花了3小時35分鐘到達高雄，爸爸到達高雄時是幾時幾分？（24時制）',
    ask:'end',
    cards:[{val:'16時20分',slot:'start'},{val:'3小時35分鐘',slot:'elapsed'}] },
  { text:'叔叔打羽球花了2小時40分鐘，打完的時間是下午4時55分，叔叔從下午幾時幾分開始打羽球？',
    ask:'start',
    cards:[{val:'2小時40分鐘',slot:'elapsed'},{val:'下午4時55分',slot:'end'}] },
];

// ── Equation templates ──────────────────────────────────────
const EQ_TMPL = {
  end:     '開始時刻 ＋ 經過時間 ＝ 結束時刻',
  elapsed: '結束時刻 － 開始時刻 ＝ 經過時間',
  start:   '結束時刻 － 經過時間 ＝ 開始時刻',
};
const EQ_ALL = [EQ_TMPL.end, EQ_TMPL.elapsed, EQ_TMPL.start];

function eqColorHtml(s) {
  return s.replace(/開始時刻/g, '<span style="color:#e67700">開始時刻</span>')
          .replace(/經過時間/g, '<span style="color:#4263eb">經過時間</span>')
          .replace(/結束時刻/g, '<span style="color:#2f9e44">結束時刻</span>');
}

// ── State ───────────────────────────────────────────────────
const GROUP_SIZE = 5;
const NUM_GROUPS = Math.ceil(PROBLEMS.length / GROUP_SIZE);

let curGroup   = 0;
let groupProbs = [];
let curIdx     = 0;
let phase      = 1;

let selectedCard = null;
let placedCards  = {};  // {start|elapsed|end: val|null}

// ── Group management ────────────────────────────────────────
function buildGroupBar() {
  const bar = document.getElementById('groupBar');
  bar.innerHTML = '';
  for (let g = 0; g < NUM_GROUPS; g++) {
    const s = g * GROUP_SIZE + 1;
    const e = Math.min(s + GROUP_SIZE - 1, PROBLEMS.length);
    const b = document.createElement('button');
    b.className = 'gp' + (g === curGroup ? ' on' : '');
    b.textContent = s + '–' + e;
    b.onclick = () => { curGroup = g; initGroup(); };
    b.id = 'gp-' + g;
    bar.appendChild(b);
  }
}

function refreshGroupBar() {
  document.querySelectorAll('.gp').forEach((b, i) => b.classList.toggle('on', i === curGroup));
}

function initGroup() {
  refreshGroupBar();
  const start = curGroup * GROUP_SIZE;
  const arr = Array.from({length: Math.min(GROUP_SIZE, PROBLEMS.length - start)}, (_, i) => start + i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  groupProbs = arr;
  curIdx = 0;
  document.getElementById('mainCard').style.display = '';
  document.getElementById('doneBanner').classList.remove('show');
  loadProblem();
}

// ── Load problem ─────────────────────────────────────────────
function loadProblem() {
  const p = PROBLEMS[groupProbs[curIdx]];
  phase = 1; selectedCard = null; placedCards = {};

  updateProgress(curIdx);

  document.getElementById('probText').textContent = p.text;

  setSteps(1);
  showPhase(1);
}

function setSteps(n) {
  document.getElementById('s1').className = 'step' + (n > 1 ? ' done' : n === 1 ? ' active' : '');
  document.getElementById('s2').className = 'step' + (n > 2 ? ' done' : n === 2 ? ' active' : '');
}

function showPhase(n) {
  phase = n;
  setSteps(n);
  document.getElementById('phase1').style.display = n === 1 ? '' : 'none';
  document.getElementById('phase2').style.display = n === 2 ? '' : 'none';
  if (n === 1) renderTimeline();
  if (n === 2) renderEquations();
}

// ── Phase 1: Timeline ────────────────────────────────────────
function renderTimeline() {
  const p = PROBLEMS[groupProbs[curIdx]];
  placedCards = {};
  selectedCard = null;

  ['start', 'elapsed', 'end'].forEach(slot => {
    const el = document.getElementById('slot' + cap(slot));
    if (slot === p.ask) {
      el.textContent = '？';
      el.className = 'tl-slot unknown';
      placedCards[slot] = '?';
    } else {
      el.textContent = '點我放入';
      el.className = 'tl-slot active';
      placedCards[slot] = null;
    }
  });

  const pool = document.getElementById('cardPool');
  pool.innerHTML = '';
  p.cards.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'val-card';
    d.textContent = c.val;
    d.dataset.idx = i;
    d.onclick = () => selectCard(i);
    pool.appendChild(d);
  });
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function selectCard(idx) {
  selectedCard = idx;
  document.querySelectorAll('.val-card').forEach((c, i) =>
    c.classList.toggle('selected', i === idx));
}

function placeCard(slot) {
  const p = PROBLEMS[groupProbs[curIdx]];
  if (slot === p.ask) return;
  if (placedCards[slot] !== null) return;

  const el = document.getElementById('slot' + cap(slot));
  if (selectedCard === null) {
    el.classList.add('err');
    setTimeout(() => { el.classList.remove('err'); el.classList.add('active'); }, 400);
    return;  // just remind to pick a card first, no penalty
  }

  const card = p.cards[selectedCard];
  if (card.slot === slot) {
    el.textContent = card.val;
    el.className = 'tl-slot locked-' + slot;
    placedCards[slot] = card.val;
    document.querySelectorAll('.val-card')[selectedCard].classList.add('gone');
    selectedCard = null;
    document.querySelectorAll('.val-card').forEach(c => c.classList.remove('selected'));

    const allDone = p.cards.every(c => placedCards[c.slot] !== null);
    if (allDone) setTimeout(() => showPhase(2), 500);
  } else {
    el.classList.add('err');
    setTimeout(goBack, 400);
  }
}

// ── Phase 2: Equation ────────────────────────────────────────
function renderEquations() {
  document.getElementById('eqReveal').classList.remove('show');
  document.getElementById('nextBtn').classList.remove('show');

  const p = PROBLEMS[groupProbs[curIdx]];
  const correct = EQ_TMPL[p.ask];
  const opts = [...EQ_ALL].sort(() => Math.random() - .5);

  const wrap = document.getElementById('eqOptions');
  wrap.innerHTML = '';
  opts.forEach(eq => {
    const b = document.createElement('button');
    b.className = 'eq-opt';
    b.innerHTML = eqColorHtml(eq);
    b.onclick = () => tryEq(b, eq, correct, p);
    wrap.appendChild(b);
  });
}

function tryEq(btn, eq, correct, p) {
  if (document.getElementById('eqReveal').classList.contains('show')) return;

  if (eq === correct) {
    btn.classList.add('ok');
    // disable other options
    document.querySelectorAll('.eq-opt').forEach(b => {
      if (b !== btn) b.style.opacity = '.35';
      b.style.pointerEvents = 'none';
    });
    showEqReveal(p);
    updateProgress(curIdx + 1);
    document.getElementById('nextBtn').classList.add('show');
  } else {
    btn.classList.add('err');
    setTimeout(goBack, 450);
  }
}

function showEqReveal(p) {
  // build the concrete equation string with actual values + ？
  const sv = (p.cards.find(c => c.slot === 'start')   || {}).val || '？';
  const ev = (p.cards.find(c => c.slot === 'elapsed') || {}).val || '？';
  const nv = (p.cards.find(c => c.slot === 'end')     || {}).val || '？';

  let abstract, concrete;
  if (p.ask === 'end') {
    abstract = '開始時刻 ＋ 經過時間 ＝ <span style="color:#e67700">結束時刻</span>';
    concrete = sv + ' ＋ ' + ev + ' ＝ <span class="qs">？</span>';
  } else if (p.ask === 'elapsed') {
    abstract = '結束時刻 － 開始時刻 ＝ <span style="color:#e67700">經過時間</span>';
    concrete = nv + ' － ' + sv + ' ＝ <span class="qs">？</span>';
  } else {
    abstract = '結束時刻 － 經過時間 ＝ <span style="color:#e67700">開始時刻</span>';
    concrete = nv + ' － ' + ev + ' ＝ <span class="qs">？</span>';
  }

  document.getElementById('eqAbstract').innerHTML = eqColorHtml(abstract);
  document.getElementById('eqConcrete').innerHTML = concrete;
  document.getElementById('eqReveal').classList.add('show');
}

// ── Helpers ──────────────────────────────────────────────────
function updateProgress(n) {
  const total = groupProbs.length;
  document.getElementById('progLabel').textContent = n + ' / ' + total;
  document.getElementById('progFill').style.width = (n / total * 100) + '%';
}

function goBack() {
  curIdx = Math.max(0, curIdx - 1);
  loadProblem();
}

// ── Navigation ───────────────────────────────────────────────
function nextProblem() {
  curIdx++;
  if (curIdx >= groupProbs.length) showDone();
  else loadProblem();
}

function showDone() {
  document.getElementById('mainCard').style.display = 'none';
  document.getElementById('doneBanner').classList.add('show');
  const s = curGroup * GROUP_SIZE + 1;
  const e = Math.min(s + GROUP_SIZE - 1, PROBLEMS.length);
  document.getElementById('doneGroup').textContent = '第 ' + s + '–' + e + ' 題';
  document.getElementById('doneNext').classList.toggle('hide', curGroup >= NUM_GROUPS - 1);
}

function goNextGroup() {
  if (curGroup < NUM_GROUPS - 1) { curGroup++; initGroup(); }
}

buildGroupBar();
initGroup();
</script>
