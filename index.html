<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>第八單元 時間</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', sans-serif; background: #f0f4ff; min-height: 100vh; }

    .hero { background: linear-gradient(135deg, #0984e3 0%, #6c5ce7 100%);
            padding: 28px 20px 24px; text-align: center; color: #fff; }
    .hero-sub { font-size: 13px; letter-spacing: 2px; opacity: .75; margin-bottom: 6px; }
    .hero-title { font-size: 26px; font-weight: bold; }

    .wrap { max-width: 680px; margin: 0 auto; padding: 16px 12px;
            display: flex; flex-direction: column; gap: 12px; }

    .section-label { font-size: 13px; font-weight: bold; color: #aaa;
                     letter-spacing: 1px; padding-left: 4px; }

    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 400px) { .cards { grid-template-columns: 1fr; } }

    .card { background: #fff; border-radius: 18px; overflow: hidden;
            box-shadow: 0 2px 12px rgba(74,108,247,.10);
            text-decoration: none; color: inherit;
            display: flex; flex-direction: column;
            transition: transform .15s;
            -webkit-tap-highlight-color: transparent; }
    .card:active { transform: scale(.97); }

    .card-top { height: 7px; }
    .card-body { padding: 14px 14px 16px; flex: 1; display: flex; flex-direction: column; }
    .card-icon { font-size: 30px; margin-bottom: 8px; }
    .card-title { font-size: 16px; font-weight: bold; color: #222; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #888; line-height: 1.5; flex: 1; }
    .card-go { margin-top: 12px; font-size: 13px; font-weight: bold; }

    .seq { display: inline-block; background: #f0f4ff; color: #4a6cf7;
           font-size: 11px; font-weight: bold; border-radius: 6px;
           padding: 2px 7px; margin-bottom: 8px; letter-spacing: .5px; }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-sub">康軒三下數學 · 第八單元</div>
  <div class="hero-title">時間</div>
</div>

<div class="wrap">
  <div class="section-label">活動一 · 一日24小時</div>
  <div class="cards">
    <a class="card" href="day24.html">
      <div class="card-top" style="background:linear-gradient(90deg,#0984e3,#74b9ff)"></div>
      <div class="card-body">
        <div class="seq">觀察</div>
        <div class="card-icon">🕐</div>
        <div class="card-title">一日24小時</div>
        <div class="card-desc">一天的24小時圓盤，看看下午3時等於幾時？認識上午、下午、24小時制。</div>
        <div class="card-go" style="color:#0984e3">開始 →</div>
      </div>
    </a>

    <a class="card" href="units.html">
      <div class="card-top" style="background:linear-gradient(90deg,#e17055,#fdcb6e)"></div>
      <div class="card-body">
        <div class="seq">發現</div>
        <div class="card-icon">⏱️</div>
        <div class="card-title">時分秒換算</div>
        <div class="card-desc">1小時＝60分鐘，1分鐘＝60秒。練習時間單位之間的換算。</div>
        <div class="card-go" style="color:#e17055">開始 →</div>
      </div>
    </a>
  </div>

  <div class="section-label">活動二 · 時分的加減</div>
  <div class="cards">
    <a class="card" href="calc.html">
      <div class="card-top" style="background:linear-gradient(90deg,#6c5ce7,#a29bfe)"></div>
      <div class="card-body">
        <div class="seq">練習</div>
        <div class="card-icon">🧮</div>
        <div class="card-title">時分加減計算</div>
        <div class="card-desc">7時40分＋35分＝？跨過整點時怎麼算？用時鐘看清楚再作答。</div>
        <div class="card-go" style="color:#6c5ce7">開始 →</div>
      </div>
    </a>
  </div>

  <div class="section-label">活動三 · 應用題</div>
  <div class="cards">
    <a class="card" href="word.html">
      <div class="card-top" style="background:linear-gradient(90deg,#20c997,#38d9a9)"></div>
      <div class="card-body">
        <div class="seq">應用</div>
        <div class="card-icon">📝</div>
        <div class="card-title">時間應用題</div>
        <div class="card-desc">開始、經過、結束——哪個是未知數？線圖＋算式四步驟，練習判斷與計算。25 題。</div>
        <div class="card-go" style="color:#20c997">開始 →</div>
      </div>
    </a>
  </div>
</div>

</body>
</html>
