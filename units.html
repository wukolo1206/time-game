<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>時分秒換算</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', sans-serif; background: #f0f4ff; min-height: 100vh; }

    .nav { display: flex; justify-content: space-between; align-items: center;
           padding: 10px 16px; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .nav a { font-size: 14px; color: #666; text-decoration: none; }
    .nav h2 { font-size: 16px; color: #333; font-weight: bold; }

    .act-bar { display: flex; background: #fff; border-bottom: 2px solid #e8eeff;
               overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .act-bar::-webkit-scrollbar { display: none; }
    .act-btn { flex: 1; min-width: 72px; padding: 8px 4px 7px; border: none;
               background: transparent; font-size: 12px; font-weight: bold;
               color: #999; cursor: pointer; text-decoration: none;
               display: flex; flex-direction: column; align-items: center; gap: 2px;
               border-bottom: 3px solid transparent; transition: color .15s, border-color .15s;
               -webkit-tap-highlight-color: transparent; white-space: nowrap; }
    .act-btn .act-icon { font-size: 16px; }
    .act-btn.act-on { color: #e17055; border-bottom-color: #e17055; background: #fff8f5; }

    .wrap { max-width: 680px; margin: 0 auto; padding: 12px;
            display: flex; flex-direction: column; gap: 14px; }

    /* Relation cards */
    .rel-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 400px) { .rel-cards { grid-template-columns: 1fr; } }

    .rel-card { background: #fff; border-radius: 18px; padding: 16px 12px;
                box-shadow: 0 2px 10px rgba(225,112,85,.12);
                display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .rel-title { font-size: 18px; font-weight: bold; color: #333; }
    .rel-title span { color: #e17055; }
    canvas { display: block; }
    .rel-note { font-size: 12px; color: #aaa; text-align: center; line-height: 1.5; }

    /* Interactive clock */
    .clock-card { background: #fff; border-radius: 20px; padding: 20px 16px;
                  box-shadow: 0 2px 14px rgba(225,112,85,.14);
                  display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #clockCvs { touch-action: none; cursor: grab; display: block; }
    #clockCvs:active { cursor: grabbing; }
    .hand-toggles { display: flex; gap: 20px; }
    .hand-toggle { display: flex; align-items: center; gap: 6px; font-size: 15px;
                   font-weight: bold; cursor: pointer; user-select: none; }
    .hand-toggle input { width: 17px; height: 17px; cursor: pointer; }
    .clock-time { font-size: 24px; font-weight: bold; color: #333; text-align: center;
                  letter-spacing: 2px; }
    .clock-rel  { font-size: 13px; color: #888; text-align: center; line-height: 2; }
    .clock-rel strong { color: #e17055; }
    .clock-reset { border: 1.5px solid #dde3ff; border-radius: 10px; background: #f8f9ff;
                   color: #888; font-size: 13px; font-weight: bold; padding: 6px 16px;
                   cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .clock-reset:active { opacity: .75; }

    /* Practice section */
    .section-title { font-size: 13px; font-weight: bold; color: #aaa; letter-spacing: 1px; padding-left: 4px; }

    .quiz-card { background: #fff; border-radius: 20px; padding: 20px;
                 box-shadow: 0 2px 10px rgba(225,112,85,.12);
                 display: flex; flex-direction: column; align-items: center; gap: 16px; }

    .prog-dots { display: flex; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #dde3ff; transition: background .3s; }
    .dot.done { background: #51cf66; }
    .dot.cur  { background: #e17055; }

    .quiz-q { font-size: 24px; font-weight: bold; color: #333; text-align: center; }
    .quiz-q .hl { color: #e17055; }
    .quiz-unit { font-size: 14px; color: #888; }

    .np-wrap { background: #f8f9ff; border-radius: 20px; padding: 12px; width: 100%; }
    .np-display { font-size: 36px; font-weight: bold; color: #333; text-align: center;
                  min-height: 48px; letter-spacing: 4px; margin-bottom: 10px; }
    .np-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .nk { border: none; border-radius: 12px; font-size: 22px; font-weight: bold;
          padding: 14px 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .nk:active { opacity: .75; }
    .nk.d  { background: #fff; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .nk.bs { background: #ffe3e3; color: #c92a2a; font-size: 18px; }
    .nk.ok { background: #51cf66; color: #fff; font-size: 18px; }
    .nk.ok:disabled { background: #ccc; cursor: default; }

    .result-box { border-radius: 14px; padding: 12px 16px; width: 100%;
                  text-align: center; display: none; }
    .result-box.ok  { background: #edfff5; border: 2px solid #51cf66; display: block; }
    .result-box.err { background: #fff5f5; border: 2px solid #ff6b6b; display: block; }
    .result-box .rt { font-size: 18px; font-weight: bold; color: #2f9e44; }
    .result-box.err .rt { color: #c92a2a; }

    .next-btn { border: none; border-radius: 14px; background: #e17055; color: #fff;
                font-size: 18px; font-weight: bold; padding: 12px 28px;
                cursor: pointer; display: none; -webkit-tap-highlight-color: transparent; }
    .next-btn.show { display: inline-block; }

    .done-banner { background: #fff; border-radius: 16px; padding: 20px;
                   box-shadow: 0 2px 10px rgba(225,112,85,.12); text-align: center;
                   width: 100%; display: none; }
    .done-banner.show { display: block; }
    .done-title { font-size: 22px; font-weight: bold; color: #2f9e44; margin-bottom: 8px; }
    .done-sub   { font-size: 14px; color: #666; margin-bottom: 14px; }
    .done-btn   { border: none; border-radius: 14px; background: #e17055; color: #fff;
                  font-size: 17px; font-weight: bold; padding: 12px 28px; cursor: pointer; }
  </style>
</head>
<body>

<div class="nav">
  <a href="index.html">← 返回</a>
  <h2>時分秒換算</h2>
  <span></span>
</div>
<nav class="act-bar">
  <a class="act-btn" href="day24.html"><span class="act-icon">🕐</span>24小時</a>
  <a class="act-btn act-on" href="units.html"><span class="act-icon">⏱️</span>時分秒</a>
  <a class="act-btn" href="calc.html"><span class="act-icon">🧮</span>加減計算</a>
</nav>

<div class="wrap">

  <!-- Interactive clock -->
  <div class="clock-card">
    <canvas id="clockCvs" width="280" height="280"></canvas>
    <div class="hand-toggles">
      <label class="hand-toggle" style="color:#333">
        <input type="checkbox" id="showHour" checked onchange="drawClock()"> 時針
      </label>
      <label class="hand-toggle" style="color:#0984e3">
        <input type="checkbox" id="showMin" checked onchange="drawClock()"> 分針
      </label>
      <label class="hand-toggle" style="color:#e17055">
        <input type="checkbox" id="showSec" checked onchange="drawClock()"> 秒針
      </label>
    </div>
    <div class="clock-time" id="clockTime">0 時  0 分  0 秒</div>
    <div class="clock-rel" id="clockRel">拖曳時鐘旋轉，看看指針怎麼走</div>
    <button class="clock-reset" onclick="resetClock()">↺ 重設</button>
  </div>

  <!-- Practice -->
  <div class="section-title">換算練習</div>
  <div class="quiz-card">
    <div class="prog-dots" id="progDots"></div>
    <div class="quiz-q" id="quizQ"></div>
    <div class="quiz-unit" id="quizUnit"></div>
    <div class="np-wrap">
      <div class="np-display" id="npDisp">—</div>
      <div class="np-grid">
        <button class="nk d" onclick="npKey(7)">7</button>
        <button class="nk d" onclick="npKey(8)">8</button>
        <button class="nk d" onclick="npKey(9)">9</button>
        <button class="nk d" onclick="npKey(4)">4</button>
        <button class="nk d" onclick="npKey(5)">5</button>
        <button class="nk d" onclick="npKey(6)">6</button>
        <button class="nk d" onclick="npKey(1)">1</button>
        <button class="nk d" onclick="npKey(2)">2</button>
        <button class="nk d" onclick="npKey(3)">3</button>
        <button class="nk bs" onclick="npBack()">⌫</button>
        <button class="nk d" onclick="npKey(0)">0</button>
        <button class="nk ok" id="okBtn" onclick="npConfirm()" disabled>✓</button>
      </div>
    </div>
    <div class="result-box" id="resultBox">
      <div class="rt" id="resultTitle"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQ()">下一題 →</button>
    <div class="done-banner" id="doneBanner">
      <div class="done-title">全部答對！</div>
      <div class="done-sub">時、分、秒的換算，你已經學會了！</div>
      <button class="done-btn" onclick="restart()">再練一次</button>
    </div>
  </div>
</div>

<script>
  // ── Interactive clock ─────────────────────────────────────
  const cvs = document.getElementById('clockCvs');
  const ctx  = cvs.getContext('2d');
  const CX = 140, CY = 140, R = 125;

  let totalSec = 0;      // 累計秒數（float），驅動所有指針
  let isDragging = false, prevAngle = 0, dragHand = null;

  // 每支指針一圈對應的秒數
  const HAND_MULT = { sec: 60, min: 3600, hour: 43200 };

  function evCoords(e) {
    const rect = cvs.getBoundingClientRect();
    const sx = cvs.width / rect.width, sy = cvs.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
  }
  function evAngle(e) { const {x,y} = evCoords(e); return Math.atan2(y - CY, x - CX); }

  function getHandAngles() {
    const ws = ((totalSec % 43200) + 43200) % 43200;
    return {
      sec:  -Math.PI/2 + (ws % 60)   / 60    * Math.PI * 2,
      min:  -Math.PI/2 + (ws % 3600)  / 3600  * Math.PI * 2,
      hour: -Math.PI/2 + ws            / 43200 * Math.PI * 2,
    };
  }

  function detectHand(x, y) {
    const ag = getHandAngles();
    const showH = document.getElementById('showHour').checked;
    const showM = document.getElementById('showMin').checked;
    const showS = document.getElementById('showSec').checked;
    const d = (angle, len) => {
      const tx = CX + len*Math.cos(angle), ty = CY + len*Math.sin(angle);
      return Math.sqrt((x-tx)**2 + (y-ty)**2);
    };
    const HIT = 35; // 觸控判定半徑
    if (showS && d(ag.sec,  R*0.85) < HIT) return 'sec';
    if (showM && d(ag.min,  R*0.70) < HIT) return 'min';
    if (showH && d(ag.hour, R*0.50) < HIT) return 'hour';
    // 沒碰到指針就預設拖秒針
    if (showS) return 'sec';
    if (showM) return 'min';
    if (showH) return 'hour';
    return null;
  }

  function drawHand(angle, len, tail, width, color) {
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(CX - tail * Math.cos(angle), CY - tail * Math.sin(angle));
    ctx.lineTo(CX + len  * Math.cos(angle), CY + len  * Math.sin(angle));
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function drawClock() {
    ctx.clearRect(0, 0, 280, 280);

    // 錶面
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#dde3ff'; ctx.lineWidth = 3; ctx.stroke();

    // 刻度
    for (let i = 0; i < 60; i++) {
      const a = -Math.PI/2 + i * Math.PI/30;
      const maj = i % 5 === 0;
      ctx.beginPath();
      ctx.moveTo(CX + (R - (maj ? 15 : 8)) * Math.cos(a), CY + (R - (maj ? 15 : 8)) * Math.sin(a));
      ctx.lineTo(CX + (R - 2) * Math.cos(a),               CY + (R - 2) * Math.sin(a));
      ctx.strokeStyle = maj ? '#666' : '#ccc'; ctx.lineWidth = maj ? 2.5 : 1; ctx.stroke();
    }

    // 數字 1–12
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#333'; ctx.font = 'bold 16px sans-serif';
    for (let h = 1; h <= 12; h++) {
      const a = -Math.PI/2 + h * Math.PI/6;
      ctx.fillText(h, CX + (R - 27) * Math.cos(a), CY + (R - 27) * Math.sin(a));
    }

    // 計算指針角度（wrapping at 12h = 43200s）
    const ws = ((totalSec % 43200) + 43200) % 43200;
    const secA  = -Math.PI/2 + (ws % 60)   / 60    * Math.PI * 2;
    const minA  = -Math.PI/2 + (ws % 3600)  / 3600  * Math.PI * 2;
    const hourA = -Math.PI/2 + ws            / 43200 * Math.PI * 2;

    const showH = document.getElementById('showHour').checked;
    const showM = document.getElementById('showMin').checked;
    const showS = document.getElementById('showSec').checked;

    if (showH) drawHand(hourA, R * 0.50, 12, 6,   '#333');
    if (showM) drawHand(minA,  R * 0.70, 10, 4,   '#0984e3');
    if (showS) drawHand(secA,  R * 0.85, 16, 1.5, '#e17055');

    // 中心軸
    ctx.beginPath(); ctx.arc(CX, CY, 6, 0, Math.PI*2);
    ctx.fillStyle = '#555'; ctx.fill();
    if (showS) {
      ctx.beginPath(); ctx.arc(CX, CY, 3, 0, Math.PI*2);
      ctx.fillStyle = '#e17055'; ctx.fill();
    }

    // 數字顯示
    const h = Math.floor(ws / 3600);
    const m = Math.floor((ws % 3600) / 60);
    const s = Math.round(ws % 60) % 60;
    document.getElementById('clockTime').textContent = h + ' 時  ' + m + ' 分  ' + s + ' 秒';

    // 關係說明（只顯示有勾選的指針）
    const tot  = Math.round(Math.max(0, totalSec));
    const secR = Math.floor(tot / 60);
    const minR = Math.floor(tot / 3600);
    const lines = [];
    if (showS) {
      let l = '秒針走了 <strong>' + tot + '</strong> 秒';
      if (secR > 0 && showM) l += '（<strong>' + secR + ' 圈</strong>）→ 分針走了 <strong>' + secR + ' 格</strong>';
      else if (secR > 0)     l += '（走了 <strong>' + secR + ' 圈</strong>）';
      lines.push(l);
    }
    if (showM && showH) {
      lines.push(minR > 0
        ? '分針走了 <strong>' + minR + ' 圈</strong> → 時針走了 <strong>' + minR + ' 大格</strong>'
        : '分針走滿一圈，時針才走一大格');
    }
    document.getElementById('clockRel').innerHTML = lines.join('<br>') || '拖曳指針旋轉';
  }

  // 拖曳旋轉：偵測觸碰哪支指針，分別以對應倍率更新 totalSec
  function startDrag(e) {
    const {x, y} = evCoords(e);
    dragHand = detectHand(x, y);
    if (!dragHand) return;
    isDragging = true; prevAngle = evAngle(e);
  }
  function doDrag(e) {
    if (!isDragging || !dragHand) return;
    const a = evAngle(e);
    let da = a - prevAngle;
    if (da > Math.PI) da -= Math.PI*2;
    if (da < -Math.PI) da += Math.PI*2;
    totalSec = Math.max(0, totalSec + da / (Math.PI*2) * HAND_MULT[dragHand]);
    prevAngle = a; drawClock();
  }
  function endDrag() { isDragging = false; dragHand = null; }

  cvs.addEventListener('mousedown',  e => { e.preventDefault(); startDrag(e); });
  window.addEventListener('mousemove', doDrag);
  window.addEventListener('mouseup',   endDrag);

  cvs.addEventListener('touchstart', e => { e.preventDefault(); startDrag(e); }, { passive: false });
  cvs.addEventListener('touchmove',  e => { e.preventDefault(); doDrag(e);   }, { passive: false });
  cvs.addEventListener('touchend',   endDrag);

  function resetClock() { totalSec = 0; drawClock(); }
  drawClock();

  // ── Practice quiz ─────────────────────────────────────────
  const PROBS = [
    { q: '1 小時 = <span class="hl">?</span> 分鐘',   ans: 60,  label: '分鐘' },
    { q: '2 小時 = <span class="hl">?</span> 分鐘',   ans: 120, label: '分鐘' },
    { q: '3 小時 = <span class="hl">?</span> 分鐘',   ans: 180, label: '分鐘' },
    { q: '60 分鐘 = <span class="hl">?</span> 小時',  ans: 1,   label: '小時' },
    { q: '120 分鐘 = <span class="hl">?</span> 小時', ans: 2,   label: '小時' },
    { q: '1 分鐘 = <span class="hl">?</span> 秒',     ans: 60,  label: '秒' },
    { q: '3 分鐘 = <span class="hl">?</span> 秒',     ans: 180, label: '秒' },
    { q: '60 秒 = <span class="hl">?</span> 分鐘',    ans: 1,   label: '分鐘' },
  ];

  let qIdx = 0, input = '', phase = 'answering';

  function loadQ() {
    const p = PROBS[qIdx];
    input = ''; phase = 'answering';
    document.getElementById('quizQ').innerHTML = p.q;
    document.getElementById('quizUnit').textContent = '（單位：' + p.label + '）';
    document.getElementById('resultBox').className = 'result-box';
    document.getElementById('nextBtn').className = 'next-btn';
    document.getElementById('doneBanner').className = 'done-banner';
    updateNp();
    renderDots();
  }

  function renderDots() {
    const el = document.getElementById('progDots');
    el.innerHTML = '';
    PROBS.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i < qIdx ? ' done' : i === qIdx ? ' cur' : '');
      el.appendChild(d);
    });
  }

  function npKey(d) {
    if (phase !== 'answering' || input.length >= 3) return;
    input += d; updateNp();
  }
  function npBack() {
    if (phase !== 'answering') return;
    input = input.slice(0,-1); updateNp();
  }
  function updateNp() {
    document.getElementById('npDisp').textContent = input || '—';
    document.getElementById('okBtn').disabled = input === '' || phase !== 'answering';
  }

  function npConfirm() {
    if (phase !== 'answering' || !input) return;
    const p = PROBS[qIdx];
    const rb = document.getElementById('resultBox');
    if (parseInt(input) === p.ans) {
      phase = 'correct';
      rb.className = 'result-box ok';
      document.getElementById('resultTitle').textContent = '✓ 答對！答案是 ' + p.ans + ' ' + p.label;
      const isLast = qIdx >= PROBS.length - 1;
      setTimeout(() => {
        document.getElementById('nextBtn').className = isLast ? 'next-btn' : 'next-btn show';
        if (isLast) setTimeout(() => { document.getElementById('doneBanner').className = 'done-banner show'; }, 300);
      }, 300);
    } else {
      rb.className = 'result-box err';
      document.getElementById('resultTitle').textContent = '× 再想想看！';
    }
    input = ''; updateNp();
  }

  function nextQ() { qIdx++; if (qIdx < PROBS.length) loadQ(); }
  function restart() { qIdx = 0; loadQ(); }

  loadQ();
</script>
</body>
</html>
